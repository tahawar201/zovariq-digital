name: Zovariq one-off website audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/zovariq-site-audit.yml'
      - '.github/scripts/site-smoke.mjs'
      - 'index.html'
      - 'script.js'
      - 'privacy.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://tahawar201.github.io/zovariq-digital/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and auditing packages
        run: |
          npm install --no-save playwright lighthouse
          npx playwright install chromium
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROME_PATH=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Test homepage and enquiry actions in Chromium
        run: node .github/scripts/site-smoke.mjs
      - name: Run fresh mobile Lighthouse audit on live homepage
        run: |
          npx lighthouse "$SITE_URL" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --form-factor=mobile --output=json --output-path=lighthouse-mobile.json --quiet
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('lighthouse-mobile.json','utf8'));
          const keys = ['performance','accessibility','best-practices','seo'];
          const score = Object.fromEntries(keys.map(k=>[k, Math.round((r.categories[k]?.score || 0)*100)]));
          const audit = r.audits;
          const details = Object.fromEntries(['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index'].map(k=>[k,audit[k]?.displayValue||'not reported']));
          console.log('LIGHTHOUSE_MOBILE ' + JSON.stringify({url:r.finalDisplayedUrl,date:r.fetchTime,score,details}));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Mobile Lighthouse audit\n\n' + JSON.stringify({score,details},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zovariq-site-audit
          path: |
            lighthouse-mobile.json
            smoke-mobile.png
            smoke-desktop.png
          if-no-files-found: ignore
